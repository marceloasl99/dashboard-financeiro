<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1B3A4B">
<title>Finance OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/chart.umd.min.js"></script>
</head>
<body>
<a class="skip" href="#main">Ir para o conteúdo</a>
<aside class="sidebar" aria-label="Navegação principal">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="currentColor"/><path d="M9 21.5 14 15l4 4 5-7.5" fill="none" stroke="#F4F2EE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Finance OS</span>
  </div>
  <nav id="nav" class="nav"></nav>
  <div class="sidebar-foot">
    <button id="themeToggle" class="btn ghost small" type="button" aria-label="Alternar tema">Tema</button>
    <span id="syncState" class="sync" aria-live="polite"></span>
  </div>
</aside>

<main id="main" class="main" tabindex="-1">
  <header class="topbar">
    <h1 id="pageTitle">Visão geral</h1>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div id="pageTools" class="page-tools"></div>
      <div class="inline" style="border-left:1px solid var(--line);padding-left:8px;margin-left:4px">
        <button id="searchBtn" class="btn small" type="button" aria-label="Busca rápida (Ctrl+K)" title="Busca rápida (Ctrl+K)">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="hide-sm" style="font-size:12px;color:var(--ink-2)">Buscar <kbd style="font-size:10px;background:var(--surface-2);border:1px solid var(--line);padding:1px 4px;border-radius:4px">Ctrl+K</kbd></span>
        </button>
        <button id="privacyBtn" class="btn small icon" type="button" aria-label="Modo Privacidade" title="Modo Privacidade (ocultar valores)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
  </header>
  <div id="view" class="view"></div>
</main>

<nav id="tabbar" class="tabbar" aria-label="Navegação"></nav>
<button id="fab" class="fab" type="button" aria-label="Novo lançamento">
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  <span>Lançar</span>
</button>

<div id="modalRoot"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
