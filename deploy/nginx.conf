# Finance OS — nginx site. Installed to /etc/nginx/sites-available/finance-os
# Replace server_name with your domain (or keep _ for IP access).
# For HTTPS: sudo certbot --nginx -d seu.dominio.com.br  (certbot edits this file)

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/finance-os/web;
    index index.html;

    client_max_body_size 20m;   # statement uploads

    # API -> uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # static front-end
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    location ~* \.(js|css|svg|webmanifest)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/manifest+json;
}
